name: Update NSE market data

on:
  workflow_dispatch:

  schedule:
    # 4:00 PM IST - First automatic update
    - cron: "30 10 * * 1-5"

    # 5:00 PM IST - Safety / second automatic update
    - cron: "30 11 * * 1-5"


# Ek hi workflow ko ek time par run hone dega.
# Agar previous run chal raha ho to naya run queue/cancel conflict
# create nahi karega.
concurrency:
  group: nse-market-data-update
  cancel-in-progress: false


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install requirements
        run: pip install -r requirements.txt


      - name: Build sector map
        run: python scripts/build_sector_map.py


      - name: Refresh NSE universe
        run: python scripts/refresh_data.py


      - name: Build delivery volume
        run: python scripts/build_delivery_volume.py


      - name: Build market cap category
        run: python scripts/build_market_cap_category.py


     

      - name: Build company research
        run: python scripts/build_company_research.py


      - name: Build market regime
        run: python scripts/build_market_regime.py


      - name: Build research scores
        run: python scripts/build_research_scores.py


      - name: Apply research scores
        run: python scripts/apply_research_scores.py


      - name: Commit updated NSE data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Daily NSE data refresh"

          git push


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .


  deploy:

    needs: update

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
