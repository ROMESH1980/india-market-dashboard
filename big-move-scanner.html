<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Move Scanner | MY MARKET RESEARCH</title>

  <style>
    :root {
      --bg: #07111f;
      --panel: #0c1728;
      --panel-2: #111d30;
      --border: #25344b;
      --text: #eef4ff;
      --muted: #94a3b8;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .brand {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a,
    .nav span {
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: #dbeafe;
      font-weight: 700;
    }

    .nav a.active {
      border-color: var(--blue);
      color: #fff;
    }

    .nav .disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      min-height: 78px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 11px;
      margin-bottom: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input,
    .page-size-select {
      background: #091426;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      outline: none;
    }

    .search-input {
      width: 260px;
    }

    .btn {
      border: 1px solid var(--border);
      background: #132238;
      color: var(--text);
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover {
      background: #1b2d47;
    }

    .market-date {
      color: var(--muted);
      font-weight: 700;
    }

    .table-shell {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .top-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      height: 15px;
      border-bottom: 1px solid var(--border);
    }

    .top-scroll-inner {
      height: 1px;
      width: 2400px;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      max-height: calc(100vh - 285px);
    }

    table {
      width: 100%;
      min-width: 2400px;
      border-collapse: separate;
      border-spacing: 0;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #122036;
      color: #f8fafc;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 9px 8px;
      text-align: left;
      white-space: nowrap;
      vertical-align: top;
    }

    tbody td {
      border-right: 1px solid #1e2d43;
      border-bottom: 1px solid #1e2d43;
      padding: 8px;
      white-space: nowrap;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #101d30;
    }

    th:last-child,
    td:last-child {
      border-right: none;
    }

    .stock-cell {
      min-width: 155px;
    }

    .stock-link {
      color: #7dd3fc;
      font-weight: 800;
      cursor: pointer;
    }

    .stock-link:hover {
      text-decoration: underline;
    }

    .filter-box {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 115px;
    }

    .filter-line {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-box input[type="number"],
    .filter-box select {
      width: 72px;
      min-width: 0;
      padding: 4px 5px;
      border-radius: 5px;
      border: 1px solid #334155;
      background: #07111f;
      color: #fff;
    }

    .filter-box select.operator {
      width: 50px;
    }

    .filter-box select.sort-select {
      width: 96px;
    }

    .filter-box label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
    }

    .number {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .positive {
      color: #4ade80;
      font-weight: 700;
    }

    .negative {
      color: #f87171;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      border: 1px solid transparent;
    }

    .badge-green {
      color: #86efac;
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .badge-yellow {
      color: #fde047;
      background: rgba(234, 179, 8, 0.12);
      border-color: rgba(234, 179, 8, 0.35);
    }

    .badge-orange {
      color: #fdba74;
      background: rgba(249, 115, 22, 0.12);
      border-color: rgba(249, 115, 22, 0.35);
    }

    .badge-red {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .badge-blue {
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .free-float-green {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 74px;
      padding: 5px 8px;
      border-radius: 7px;
      color: #bbf7d0;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.45);
      font-weight: 800;
    }

    .missing {
      max-width: 260px;
      white-space: normal;
      line-height: 1.3;
      color: #fca5a5;
    }

    .trigger-cell {
      max-width: 230px;
      white-space: normal;
      line-height: 1.3;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 11px;
      border-top: 1px solid var(--border);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pagination-info {
      color: var(--muted);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.58);
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -620px;
      z-index: 60;
      width: min(600px, 94vw);
      height: 100vh;
      overflow-y: auto;
      background: #091426;
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.35);
      transition: right 0.2s ease;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: #0d1a2c;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      font-size: 21px;
      font-weight: 800;
    }

    .drawer-close {
      border: 1px solid var(--border);
      background: #17263d;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 20px;
    }

    .drawer-body {
      padding: 16px;
    }

    .detail-section {
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
    }

    .detail-section h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .detail-item {
      background: #091426;
      border: 1px solid #22334a;
      border-radius: 7px;
      padding: 9px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .loading-row td,
    .empty-row td {
      text-align: center;
      padding: 30px 10px;
      color: var(--muted);
    }

    @media (max-width: 1000px) {
      .summary-grid {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }

      .table-wrap {
        max-height: calc(100vh - 350px);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 10px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .search-input {
        width: 100%;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

  <script>

    let allRows = [];

    const filterState = {};

    const $ = (id) => document.getElementById(id);

    function firstDefined(...values) {
      for (const value of values) {
        if (value !== undefined && value !== null && value !== "") {
          return value;
        }
      }
      return null;
    }

    function toNumber(value) {
      if (value === null || value === undefined || value === "") {
        return null;
      }

      if (typeof value === "number") {
        return Number.isFinite(value) ? value : null;
      }

      const cleaned = String(value)
        .replace(/,/g, "")
        .replace(/₹/g, "")
        .replace(/%/g, "")
        .replace(/x$/i, "")
        .trim();

      if (!cleaned) {
        return null;
      }

      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : null;
    }

    function roundNumber(value, decimals = 2) {
      const n = toNumber(value);

      if (n === null) {
        return null;
      }

      const factor = 10 ** decimals;
      return Math.round((n + Number.EPSILON) * factor) / factor;
    }

    function formatNumber(value, decimals = 2) {
      const n = toNumber(value);

      if (n === null) {
        return "—";
      }

      return n.toLocaleString("en-IN", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatInteger(value) {
      const n = toNumber(value);

      if (n === null) {
        return "—";
      }

      return Math.round(n).toLocaleString("en-IN");
    }

    function formatPct(value) {
      const n = toNumber(value);

      if (n === null) {
        return "—";
      }

      return `${n.toFixed(2)}%`;
    }

    function formatX(value) {
      const n = toNumber(value);

      if (n === null) {
        return "—";
      }

      return `${n.toFixed(2)}x`;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeText(value) {
      if (value === null || value === undefined) {
        return "";
      }

      if (Array.isArray(value)) {
        return value
          .filter(Boolean)
          .map((item) => String(item).trim())
          .filter(Boolean)
          .join(", ");
      }

      if (typeof value === "object") {
        try {
          return JSON.stringify(value);
        } catch (error) {
          return String(value);
        }
      }

      return String(value).trim();
    }

    function isTruthyFlag(value) {
      if (value === true || value === 1) {
        return true;
      }

      const text = String(value ?? "")
        .trim()
        .toLowerCase();

      return [
        "yes",
        "true",
        "1",
        "pass",
        "passed",
        "strong",
        "contracting",
        "contraction"
      ].includes(text);
    }

    function getSymbol(row) {
      return normalizeText(
        firstDefined(
          row.symbol,
          row.stock,
          row.ticker,
          row.Symbol,
          row.SYMBOL
        )
      );
    }

    function getCompanyName(row) {
      return normalizeText(
        firstDefined(
          row.companyName,
          row.company,
          row.name,
          row.company_name,
          row.NAME_OF_COMPANY
        )
      );
    }

    function getPrice(row) {
      return toNumber(
        firstDefined(
          row.price,
          row.close,
          row.lastPrice,
          row.last_price,
          row.ltp
        )
      );
    }

    function getFreeFloatShares(row) {
      return toNumber(
        firstDefined(
          row.freeFloatShares,
          row.free_float_shares,
          row.tradablePublicShares,
          row.tradable_public_shares
        )
      );
    }

    function getFreeFloatCr(row) {
      const direct = toNumber(
        firstDefined(
          row.freeFloatCr,
          row.freeFloatMcapCr,
          row.freeFloatMarketCapCr,
          row.free_float_cr,
          row.free_float_mcap_cr
        )
      );

      if (direct !== null) {
        return direct;
      }

      const shares = getFreeFloatShares(row);
      const price = getPrice(row);

      if (shares === null || price === null) {
        return null;
      }

      return (shares * price) / 10000000;
    }

    function getBigMoveScore(row) {
      return toNumber(
        firstDefined(
          row.bigMoveScore,
          row.big_move_score,
          row.score,
          row.bigMoveTechnicalScore

      );
    }

    function getSetupStatus(row) {
      return normalizeText(

    function getReturn1W(row) {

    function getReturn1M(row) {

    function getReturn3M(row) {

    }

    function getReturn6M(row) {
      return toNumber(

          row.ret_6m
        )
      );
    }

    function getRSRating(row) {
      return toNumber(

        )
      );
    }

    function getStockMomentumRating(row) {
      return toNumber(

          row.stockMomentum,

    }

    function getIndustryRating(row) {
      return toNumber(

    }

    function getPriorMovePct(row) {

    function getRetracementPct(row) {

    function getConsolidationDays(row) {

    function getVolumeContraction(row) {

    }

    function getVolatilityContraction(row) {

    function getBreakoutStatus(row) {

    function getTurnoverExpansion(row) {

    function getKeyTrigger(row) {

        )
      );
    }

    function getMissingConditions(row) {
      return normalizeText(
        firstDefined(
          row.missingConditions,
          row.missing_conditions,
          row.missing,
          row.missingCriteria
        )
      );
    }

    function enrichRow(row, index) {
      return {
        ...row,

        __index: index,

        symbol: getSymbol(row),
        companyName: getCompanyName(row),

        bigMoveScore: getBigMoveScore(row),
        setupStatus: getSetupStatus(row),

        price: getPrice(row),

        return1W: getReturn1W(row),
        return1M: getReturn1M(row),
        return3M: getReturn3M(row),
        return6M: getReturn6M(row),

        rsRating: getRSRating(row),
        stockMomentumRating: getStockMomentumRating(row),
        industryRating: getIndustryRating(row),

        freeFloatCr: getFreeFloatCr(row),

        priorMovePct: getPriorMovePct(row),
        retracementPct: getRetracementPct(row),
        consolidationDays: getConsolidationDays(row),

        volumeContraction: getVolumeContraction(row),
        volatilityContraction: getVolatilityContraction(row),

        breakoutStatus: getBreakoutStatus(row),
        turnoverExpansion: getTurnoverExpansion(row),

        fundamentalTrigger: getFundamentalTrigger(row),
        keyTrigger: getKeyTrigger(row)
      };
    }

    function getRowsFromPayload(payload) {
      if (Array.isArray(payload)) {
        return payload;
      }

      const possibleArrays = [
        payload?.rows,
        payload?.stocks,
        payload?.data,
        payload?.scanner,
        payload?.results,
        payload?.items
      ];

      for (const item of possibleArrays) {
        if (Array.isArray(item)) {
          return item;
        }
      }

      return [];
    }

    function getMarketDateFromPayload(payload) {
      if (!payload || Array.isArray(payload)) {
        return "";
      }

      return normalizeText(
        firstDefined(
          payload.marketDate,
          payload.market_date,
          payload.date,
          payload.asOfDate,
          payload.as_of_date
        )
      );
    }

    function makeFilterState() {
      for (const column of columns) {
        if (!column.filterable) {
          continue;
        }

        filterState[column.field] = {
          active: false,
          operator: ">=",
          value: "",
          sort: ""
        };
      }
    }

    function buildTableHeader() {
      const headRow = $("tableHeadRow");

      headRow.innerHTML = columns
        .map((column) => {
          if (!column.filterable) {
            return `
              <th data-field="${escapeHtml(column.field)}">
                ${escapeHtml(column.label)}
              </th>
            `;
          }

          return `
            <th data-field="${escapeHtml(column.field)}">
              <div>${escapeHtml(column.label)}</div>

              <div class="filter-box">
                <label>
                  <input
                    type="checkbox"
                    class="filter-active"
                    data-field="${escapeHtml(column.field)}"
                  />
                  Active
                </label>

                <div class="filter-line">
                  <select
                    class="operator"
                    data-field="${escapeHtml(column.field)}"
                  >
                    <option value=">=">≥</option>
                    <option value="<=">≤</option>
                  </select>

                  <input
                    type="number"
                    step="any"
                    class="filter-value"
                    data-field="${escapeHtml(column.field)}"
                    placeholder="Value"
                  />
                </div>

                <select
                  class="sort-select"
                  data-field="${escapeHtml(column.field)}"
                >
                  <option value="">Default</option>
                  <option value="desc">Descending</option>
                  <option value="asc">Ascending</option>
                </select>
              </div>
            </th>
          `;
        })
        .join("");

      bindHeaderFilterEvents();
    }

    function bindHeaderFilterEvents() {
      document.querySelectorAll(".filter-active").forEach((element) => {
        element.addEventListener("change", (event) => {
          const field = event.target.dataset.field;

          if (!filterState[field]) {
            return;
          }

          filterState[field].active = event.target.checked;
          currentPage = 1;
          applyFiltersAndRender();
        });
      });

      document.querySelectorAll(".operator").forEach((element) => {
        element.addEventListener("change", (event) => {
          const field = event.target.dataset.field;

          if (!filterState[field]) {
            return;
          }

          filterState[field].operator = event.target.value;
          currentPage = 1;
          applyFiltersAndRender();
        });
      });

      document.querySelectorAll(".filter-value").forEach((element) => {
        element.addEventListener("input", (event) => {
          const field = event.target.dataset.field;

          if (!filterState[field]) {
            return;
          }

          filterState[field].value = event.target.value;
          currentPage = 1;
          applyFiltersAndRender();
        });
      });

      document.querySelectorAll(".sort-select").forEach((element) => {
        element.addEventListener("change", (event) => {
          const field = event.target.dataset.field;

          if (!filterState[field]) {
            return;
          }

          filterState[field].sort = event.target.value;

          if (event.target.value) {
            for (const key of Object.keys(filterState)) {
              if (key !== field) {
                filterState[key].sort = "";

                const otherSort = document.querySelector(
                  `.sort-select[data-field="${key}"]`
                );

                if (otherSort) {
                  otherSort.value = "";
                }
              }
            }
          }

          currentPage = 1;
          applyFiltersAndRender();
        });
      });
    }

    function clearFilters() {
      for (const field of Object.keys(filterState)) {
        filterState[field] = {
          active: false,
          operator: ">=",
          value: "",
          sort: ""
        };
      }

      $("searchInput").value = "";

      document.querySelectorAll(".filter-active").forEach((element) => {
        element.checked = false;
      });

      document.querySelectorAll(".operator").forEach((element) => {
        element.value = ">=";
      });

      document.querySelectorAll(".filter-value").forEach((element) => {
        element.value = "";
      });

      document.querySelectorAll(".sort-select").forEach((element) => {
        element.value = "";
      });

      currentPage = 1;
      applyFiltersAndRender();
    }

    function passesNumericFilter(row, field, state) {
      if (!state.active) {
        return true;
      }

      const threshold = toNumber(state.value);

      if (threshold === null) {
        return true;
      }

      const value = toNumber(row[field]);

      if (value === null) {
        return false;
      }

      if (state.operator === "<=") {
        return value <= threshold;
      }

      return value >= threshold;
    }

    function getActiveSort() {
      for (const [field, state] of Object.entries(filterState)) {
        if (state.sort === "asc" || state.sort === "desc") {
          return {
            field,
            direction: state.sort
          };
        }
      }

      return null;
    }
        function applyFiltersAndRender() {
      const searchText = $("searchInput")
        .value
        .trim()
        .toLowerCase();

      filteredRows = allRows.filter((row) => {
        if (searchText) {
          const searchable = [
            row.symbol,
            row.companyName,
            row.setupStatus,
            row.breakoutStatus,
            row.fundamentalTrigger,
            row.keyTrigger
          ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

          if (!searchable.includes(searchText)) {
            return false;
          }
        }

        for (const [field, state] of Object.entries(filterState)) {
          if (!passesNumericFilter(row, field, state)) {
            return false;
          }
        }

        return true;
      });

      const activeSort = getActiveSort();

      if (activeSort) {
        const { field, direction } = activeSort;

        filteredRows.sort((a, b) => {
          const aValue = toNumber(a[field]);
          const bValue = toNumber(b[field]);

          if (aValue === null && bValue === null) {
            return a.__index - b.__index;
          }

          if (aValue === null) {
            return 1;
          }

          if (bValue === null) {
            return -1;
          }

          if (direction === "asc") {
            return aValue - bValue;
          }

          return bValue - aValue;
        });
      } else {
        filteredRows.sort((a, b) => {
          const scoreA = toNumber(a.bigMoveScore);
          const scoreB = toNumber(b.bigMoveScore);

          if (scoreA === null && scoreB === null) {
            return a.__index - b.__index;
          }

          if (scoreA === null) {
            return 1;
          }

          if (scoreB === null) {
            return -1;
          }

          return scoreB - scoreA;
        });
      }

      const totalPages = Math.max(
        1,
        Math.ceil(filteredRows.length / pageSize)
      );

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      if (currentPage < 1) {
        currentPage = 1;
      }

      renderTable();
      renderPagination();
    }

    function pctClass(value) {
      const n = toNumber(value);

      if (n === null || n === 0) {
        return "";
      }

      return n > 0 ? "positive" : "negative";
    }

    function scoreBadge(value) {
      const n = toNumber(value);

      if (n === null) {
        return `<span class="muted">—</span>`;
      }

      let badgeClass = "badge-red";

      if (n >= 80) {
        badgeClass = "badge-green";
      } else if (n >= 65) {
        badgeClass = "badge-blue";
      } else if (n >= 50) {
        badgeClass = "badge-yellow";
      } else if (n >= 35) {
        badgeClass = "badge-orange";
      }

      return `
        <span class="badge ${badgeClass}">
          ${escapeHtml(formatInteger(n))}
        </span>
      `;
    }

    function setupStatusBadge(value) {
      const text = normalizeText(value);

      if (!text) {
        return `<span class="muted">—</span>`;
      }

      const lower = text.toLowerCase();

      let badgeClass = "badge-blue";

      if (
        lower.includes("strong") ||
        lower.includes("ready") ||
        lower.includes("pass")
      ) {
        badgeClass = "badge-green";
      } else if (
        lower.includes("near") ||
        lower.includes("watch")
      ) {
        badgeClass = "badge-yellow";
      } else if (
        lower.includes("weak") ||
        lower.includes("fail")
      ) {
        badgeClass = "badge-red";
      }

      return `
        <span class="badge ${badgeClass}">
          ${escapeHtml(text)}
        </span>
      `;
    }

    function yesNoBadge(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return `<span class="muted">—</span>`;
      }

      const text = normalizeText(value);

      if (isTruthyFlag(value)) {
        return `
          <span class="badge badge-green">
            ${escapeHtml(text || "YES")}
          </span>
        `;
      }

      const lower = text.toLowerCase();

      if (
        lower === "no" ||
        lower === "false" ||
        lower === "0" ||
        lower.includes("not")
      ) {
        return `
          <span class="badge badge-red">
            ${escapeHtml(text || "NO")}
          </span>
        `;
      }

      return `
        <span class="badge badge-blue">
          ${escapeHtml(text)}
        </span>
      `;
    }

    function breakoutBadge(value) {
      const text = normalizeText(value);

      if (!text) {
        return `<span class="muted">—</span>`;
      }

      const lower = text.toLowerCase();

      let badgeClass = "badge-blue";

      if (
        lower.includes("breakout") &&
        !lower.includes("near") &&
        !lower.includes("no")
      ) {
        badgeClass = "badge-green";
      } else if (
        lower.includes("near") ||
        lower.includes("approach")
      ) {
        badgeClass = "badge-yellow";
      } else if (
        lower.includes("below") ||
        lower.includes("far") ||
        lower.includes("no")
      ) {
        badgeClass = "badge-red";
      }

      return `
        <span class="badge ${badgeClass}">
          ${escapeHtml(text)}
        </span>
      `;
    }

    function freeFloatDisplay(value) {
      const n = toNumber(value);

      if (n === null) {
        return `<span class="muted">—</span>`;
      }

      const formatted = formatNumber(n, 2);

      if (n <= 5000) {
        return `
          <span class="free-float-green">
            ${escapeHtml(formatted)}
          </span>
        `;
      }

      return escapeHtml(formatted);
    }

    function textOrDash(value) {
      const text = normalizeText(value);

      if (!text) {
        return `<span class="muted">—</span>`;
      }

      return escapeHtml(text);
    }

    function renderPagination() {
      const total = filteredRows.length;

      const totalPages = Math.max(
        1,
        Math.ceil(total / pageSize)
      );

      const start =
        total === 0
          ? 0
          : (currentPage - 1) * pageSize + 1;

      const end = Math.min(
        currentPage * pageSize,
        total
      );

      $("paginationInfo").textContent =
        total === 0
          ? "0 stocks"
          : `${start.toLocaleString("en-IN")}–${end.toLocaleString(
              "en-IN"
            )} of ${total.toLocaleString("en-IN")} stocks`;

      $("pageNumberLabel").textContent =
        `Page ${currentPage} / ${totalPages}`;

      const goToInput = $("goToPageInput");

      if (goToInput) {
        goToInput.max = String(totalPages);

        if (document.activeElement !== goToInput) {
          goToInput.value = String(currentPage);
        }
      }

      $("prevPageBtn").disabled =
        currentPage <= 1;

      $("nextPageBtn").disabled =
        currentPage >= totalPages;

    function csvEscape(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      const text = String(value);

      if (
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n")
      ) {
        return `"${text.replace(/"/g, '""')}"`;
      }

      return text;
    }

    function exportCsv() {
      const rowsToExport = filteredRows.length
        ? filteredRows
        : allRows;

      if (!rowsToExport.length) {
        alert("No scanner data available for export.");
        return;
      }

      const headers = [
        "Stock",
        "Company Name",
        "Big Move Score",
        "Setup Status",
        "Price",
        "1W %",
        "1M %",
        "3M %",
        "6M %",
        "RS",
        "Stock Momentum",
        "Industry Rating",
        "Free Float ₹ Cr",
        "Prior Move %",
        "Retracement %",
        "Consolidation Days",
        "Volume Contraction",
        "Volatility Contraction",
        "Breakout Status",
        "Turnover Expansion",
        "Fundamental Trigger",
        "Key Trigger"
      ];

      const csvRows = [
        headers.map(csvEscape).join(",")
      ];

      for (const row of rowsToExport) {
        const values = [
          row.symbol,
          row.companyName,
          row.bigMoveScore,
          row.setupStatus,
          row.price,
          row.return1W,
          row.return1M,
          row.return3M,
          row.return6M,
          row.rsRating,
          row.stockMomentumRating,
          row.industryRating,
          row.freeFloatCr,
          row.priorMovePct,
          row.retracementPct,
          row.consolidationDays,
          normalizeText(row.volumeContraction),
          normalizeText(row.volatilityContraction),
          row.breakoutStatus,
          row.turnoverExpansion,
          row.fundamentalTrigger,
          row.keyTrigger
        ];

        csvRows.push(
          values.map(csvEscape).join(",")
        );
      }

      const csvContent =
        "\uFEFF" + csvRows.join("\n");

      const blob = new Blob(
        [csvContent],
        {
          type: "text/csv;charset=utf-8;"
        }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      const safeDate = marketDate
        ? marketDate.replace(/[^\d-]/g, "")
        : "latest";

      link.href = url;
      link.download =
        `BIG_MOVE_SCANNER_${safeDate}_${rowsToExport.length}_stocks.csv`;

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    function syncTopScrollbar() {
      const tableWrap = $("tableWrap");
      const topScroll = $("topScroll");
      const topScrollInner = $("topScrollInner");
      const table = $("scannerTable");

      if (
        !tableWrap ||
        !topScroll ||
        !topScrollInner ||
        !table
      ) {
        return;
      }

    const tableWidth = table.scrollWidth;

      topScrollInner.style.width =
        `${tableWidth}px`;

      if (
        Math.abs(
          topScroll.scrollLeft -
          tableWrap.scrollLeft
        ) > 1
      ) {
        topScroll.scrollLeft =
          tableWrap.scrollLeft;
      }
    }

    function bindScrollbars() {
      const tableWrap = $("tableWrap");
      const topScroll = $("topScroll");

      let syncingFromTop = false;
      let syncingFromTable = false;

      topScroll.addEventListener(
        "scroll",
        () => {
          if (syncingFromTable) {
            return;
          }

          syncingFromTop = true;

          tableWrap.scrollLeft =
            topScroll.scrollLeft;

          requestAnimationFrame(() => {
            syncingFromTop = false;
          });
        }
      );

      tableWrap.addEventListener(
        "scroll",
        () => {
          if (syncingFromTop) {
            return;
          }

          syncingFromTable = true;

          topScroll.scrollLeft =
            tableWrap.scrollLeft;

          requestAnimationFrame(() => {
            syncingFromTable = false;
          });
        }
      );
    }


    function goToRequestedPage() {
      const input = $("goToPageInput");

      if (!input) {
        return;
      }

      const requested = Number(input.value);

      const totalPages = Math.max(
        1,
        Math.ceil(filteredRows.length / pageSize)
      );

      if (!Number.isInteger(requested) || requested < 1) {
        input.value = "";
        input.focus();
        return;
      }

      currentPage = Math.min(requested, totalPages);
      input.value = currentPage;

      renderTable();
      renderPagination();

      $("tableWrap").scrollTop = 0;
    }

    function bindPageEvents() {
      $("searchInput").addEventListener(
        "input",
        () => {
          currentPage = 1;
          applyFiltersAndRender();
        }
      );

      $("clearFiltersBtn").addEventListener(
        "click",
        clearFilters
      );

      $("exportCsvBtn").addEventListener(
        "click",
        exportCsv
      );

      $("pageSizeSelect").addEventListener(
        "change",
        (event) => {
          const nextSize = Number(
            event.target.value
          );

          pageSize =
            Number.isFinite(nextSize) &&
            nextSize > 0
              ? nextSize
              : 100;

          currentPage = 1;
          applyFiltersAndRender();
        }
      );

      $("goToPageBtn").addEventListener(
        "click",
        goToRequestedPage
      );

      $("goToPageInput").addEventListener(
        "keydown",
        (event) => {
          if (event.key === "Enter") {
            goToRequestedPage();
          }
        }
      );

      $("prevPageBtn").addEventListener(
        "click",
        () => {
          if (currentPage <= 1) {
            return;
          }

          currentPage -= 1;
          renderTable();
          renderPagination();

          $("tableWrap").scrollTop = 0;
        }
      );

      $("nextPageBtn").addEventListener(
        "click",
        () => {
          const totalPages = Math.max(
            1,
            Math.ceil(
              filteredRows.length /
              pageSize
            )
          );

          if (currentPage >= totalPages) {
            return;
          }

          currentPage += 1;
          renderTable();
          renderPagination();

          $("tableWrap").scrollTop = 0;
        }
      );

      $("drawerCloseBtn").addEventListener(
        "click",
        closeDrawer
      );

      $("drawerBackdrop").addEventListener(
        "click",
        closeDrawer
      );

      document.addEventListener(
        "keydown",
        (event) => {
          if (event.key === "Escape") {
            closeDrawer();
          }
        }
      );

      window.addEventListener(
        "resize",
        () => {
          syncTopScrollbar();
        }
      );
    }

      $("pageNumberLabel").textContent =
        "Page 1";

      $("prevPageBtn").disabled = true;
      $("nextPageBtn").disabled = true;
    }

    async function loadScannerData() {
      try {
        const response = await fetch(
          `${DATA_URL}?v=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status} while loading ${DATA_URL}`
          );
        }

        const payload =
          await response.json();

        const rawRows =
          getRowsFromPayload(payload);

        marketDate =
          getMarketDateFromPayload(payload);

        allRows = rawRows
          .map((row, index) => {
            return enrichRow(
              row,
              index
            );
          })
          .filter((row) => {
            return Boolean(row.symbol);
          });

        if (!marketDate && allRows.length) {
          marketDate = normalizeText(
            firstDefined(
              allRows[0].marketDate,
              allRows[0].market_date,
              allRows[0].date
            )
          );
        }

        $("marketDateLabel").textContent =
          marketDate
            ? `Market Date: ${marketDate}`
            : "Market Date: —";


        currentPage = 1;

        applyFiltersAndRender();

        requestAnimationFrame(() => {
          syncTopScrollbar();
        });
      } catch (error) {
        showLoadError(error);
      }
    }

    function initializeScanner() {
      makeFilterState();

      buildTableHeader();

      bindPageEvents();

      bindScrollbars();

      loadScannerData();
    }

    document.addEventListener(
      "DOMContentLoaded",
      initializeScanner
    );
  </script>
</body>
</html>
