name: Test Current Market Cap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-market-cap:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run current market cap test
        run: python scripts/build_current_market_cap.py
